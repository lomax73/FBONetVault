{% extends "base.html" %}

{% block title %}Rete wireless — FBONetVault{% endblock %}

{% block content %}
<h1>{% if object %}Modifica rete wireless{% else %}Nuova rete wireless{% endif %}</h1>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Salva</button>
        <a class="btn btn-secondary" href="{% url 'progetto-detail' object.progetto_id|default:progetto_pk %}">Annulla</a>
    </form>
</div>
{% endblock %}
