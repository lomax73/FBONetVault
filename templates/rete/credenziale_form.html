{% extends "base.html" %}

{% block title %}Credenziale — FBONetVault{% endblock %}

{% block content %}
<h1>{% if object %}Modifica credenziale{% else %}Nuova credenziale{% endif %}</h1>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Salva</button>
        {% if object %}
        <a class="btn btn-secondary" href="{% url 'apparato-detail' object.apparato_id %}">Annulla</a>
        {% else %}
        <a class="btn btn-secondary" href="{% url 'apparato-detail' apparato_pk %}">Annulla</a>
        {% endif %}
    </form>
</div>
{% endblock %}
