{% extends "base.html" %}

{% block title %}VLAN — FBONetVault{% endblock %}

{% block content %}
<h1>{% if object %}Modifica VLAN{% else %}Nuova VLAN{% endif %}</h1>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Salva</button>
        {% if object %}
        <a class="btn btn-secondary" href="{% url 'progetto-detail' object.progetto_id %}">Annulla</a>
        {% else %}
        <a class="btn btn-secondary" href="{% url 'progetto-detail' progetto_pk %}">Annulla</a>
        {% endif %}
    </form>
</div>
{% endblock %}
