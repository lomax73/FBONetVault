{% extends "base.html" %}

{% block title %}Apparato — FBONetVault{% endblock %}

{% block content %}
<h1>{% if object %}Modifica apparato{% else %}Nuovo apparato{% endif %}</h1>
<div class="card">
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn" type="submit">Salva</button>
        <a class="btn btn-secondary" href="{% url 'cliente-detail' object.cliente_id|default:cliente_id %}">Annulla</a>
    </form>
</div>
{% endblock %}
